<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUB Cover Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --navy:#0F2545;
    --navy-2:#173463;
    --green:#1F7A45;
    --paper:#FDFCF9;
    --canvas:#EEF1F6;
    --ink:#151A23;
    --muted:#5B6472;
    --line:#D7DCE4;
    --accent-line:#C9A24B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Space Grotesk', sans-serif;
    background:var(--canvas);
    color:var(--ink);
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    border-bottom:3px solid var(--accent-line);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    width:10px;height:10px;background:var(--green);
    display:inline-block;border-radius:1px;
  }
  .brand h1{
    font-size:17px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }
  .brand span{
    font-size:12.5px;
    color:#B9C4D6;
  }
  .tab-toggle{
    display:none;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:8px;
    padding:4px;
    gap:2px;
  }
  .tab-toggle button{
    background:transparent;
    border:none;
    color:#B9C4D6;
    font-family:inherit;
    font-size:17px;
    padding:7px 14px;
    border-radius:6px;
    cursor:pointer;
  }
  .tab-toggle button.active{
    background:#fff;
    color:var(--navy);
    font-weight:600;
  }

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:400px 1fr;
    gap:0;
    align-items:start;
  }
  .panel{padding:28px;}
  .form-panel{
    background:var(--paper);
    border-right:1px solid var(--line);
    min-height:calc(100vh - 62px);
    position:sticky;
    top:0;
    overflow-y:auto;
    max-height:100vh;
  }
  .preview-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 28px;
  }

  h2.section-title{
    font-size:11.5px;
    font-weight:600;
    color:var(--green);
    text-transform:uppercase;
    letter-spacing:1.1px;
    margin:26px 0 12px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  h2.section-title:first-of-type{margin-top:0;}

  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    padding:9px 11px;
    font-family:inherit;
    font-size:13.5px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--navy-2);
    box-shadow:0 0 0 3px rgba(23,52,99,0.12);
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hidden-field{display:none !important;}

  .logo-drop{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:14px;
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    cursor:pointer;
    background:#fff;
  }
  .logo-drop img{max-height:40px;margin-bottom:6px;}
  .logo-drop input{display:none;}
  .logo-drop small{display:block;margin-top:4px;color:#8892A0;}
  .clear-logo{
    font-size:11.5px;color:var(--muted);text-decoration:underline;
    cursor:pointer;margin-top:6px;display:inline-block;
  }

  .actions{margin-top:26px;display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    font-family:inherit;font-size:17px;font-weight:600;
    padding:11px 16px;border-radius:7px;border:none;cursor:pointer;
    flex:1;min-width:140px;
  }
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-secondary{background:#fff;color:var(--navy);border:1px solid var(--line);}
  .btn-secondary:hover{border-color:var(--navy-2);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px dashed var(--line);}

  /* ---------- A4 preview: single-column, centered, matches the official cover ---------- */
  .page-shell{
    background:#fff;
    box-shadow:0 2px 4px rgba(15,37,69,0.06), 0 18px 40px rgba(15,37,69,0.14);
    width:100%;
    max-width:620px;
  }
  #cover{
    aspect-ratio:210/297;
    width:100%;
    background:#fff;
    padding:9% 12% 8%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    font-family:'Source Serif 4', serif;
    color:var(--ink);
  }
  .c-logo{
    max-width:78%;
    max-height:15%;
    object-fit:contain;
    margin-bottom:14%;
    margin-top: 5%;
  }
  .c-title{
    font-size:18px;
    font-weight:700;
    line-height:1.35;
  }
  .c-subtitle{
    font-size:17px;
    color:var(--ink);
    margin-top:4px;
  }
  .c-topic{
    font-size:17px;
    font-style:italic;
    margin-top:6px;
    color:var(--navy-2);
  }
  .c-course{
    margin-top:9%;
    font-size:17px;
    line-height:1.9;
  }
  .c-course b{font-weight:700;}
  .c-spacer{flex-grow:1;}
  .c-block-label{
    font-size:16.5px;
    margin-bottom:2px;
  }
  .c-block .name{font-weight:700;font-size:17px;margin-bottom:1px;}
  .c-block .line{font-size:16.5px;line-height:1.55;}
  .c-block{margin-bottom:6%;}
  .c-submission{
    font-size:17px;
    margin-top:4%;
  }

  footer.credit{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    margin-top:20px;
  }

  @media (max-width:880px){
    .layout{grid-template-columns:1fr;}
    .form-panel{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);}
    .tab-toggle{display:flex;}
    .panel.hide{display:none;}
  }

  /* ---------- Print: this is what makes the PDF sharp + text-selectable ----------
     "Save as PDF" triggers window.print(); the browser's native print-to-PDF
     renders real vector text instead of a rasterized screenshot.
     We use display:none (not visibility:hidden) on everything except the cover,
     so hidden elements don't still reserve layout height and create blank pages. */
  @media print{
    @page{ size:A4 portrait; margin:0; }
    html,body{ background:#fff; margin:0; padding:0; height:auto; min-height:0; }
    .topbar, .tab-toggle, .form-panel, footer.credit{ display:none !important; }
    .layout{ display:block !important; }
    .preview-panel{ display:block !important; padding:0 !important; margin:0 !important; }
    .page-shell{ box-shadow:none !important; max-width:none !important; width:auto !important; margin:0 !important; }
    #cover{
      width:210mm;
      height:297mm;
      aspect-ratio:unset;
      margin:0;
      box-shadow:none;
      page-break-after:avoid;
      page-break-inside:avoid;
    }
    /* Font sizes above were tuned for the ~620px-wide on-screen preview.
       A real A4 page prints at ~794px wide, so the same px values read
       smaller on paper — scale each one up (~1.3x) for print only. */
    .c-title{ font-size:23px !important; }
    .c-subtitle, .c-topic, .c-course{ font-size:17px !important; }
    .c-block-label{ font-size:16px !important; }
    .c-block .name{ font-size:17px !important; }
    .c-block .line, .c-submission{ font-size:17px !important; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <span class="mark"></span>
      <h1>Cover Generator</h1>
      <span>Northern University Bangladesh</span>
    </div>
    <div class="tab-toggle" id="tabToggle">
      <button class="active" data-tab="form">Edit details</button>
      <button data-tab="preview">Preview</button>
    </div>
  </div>

  <div class="layout">

    <!-- FORM -->
    <div class="panel form-panel" id="formPanel">

      <h2 class="section-title">Logo</h2>
      <div class="field">
        <label class="logo-drop" id="logoDrop">
          <div id="logoDropInner">Using the default NUB logo — click to replace it</div>
          <input type="file" id="logoInput" accept="image/*">
        </label>
        <span class="clear-logo" id="clearLogo">Reset to default NUB logo</span>
      </div>

      <h2 class="section-title">Document</h2>
      <div class="field">
        <label for="docKind">Document type</label>
        <select id="docKind">
          <option value="LAB REPORT">Lab Report / Lab Work</option>
          <option value="ASSIGNMENT ON">Assignment</option>
          <option value="TERM PAPER ON">Term Paper</option>
          <option value="PROJECT REPORT ON">Project Report</option>
          <option value="CASE STUDY ON">Case Study</option>
        </select>
      </div>

      <div class="field" id="fieldLabNumber">
        <label for="labNumber">Lab work / experiment no.</label>
        <input id="labNumber" type="text" placeholder="e.g. 1">
      </div>
      <div class="field" id="fieldExpDate">
        <label for="expDate">Date of experiment</label>
        <input id="expDate" type="text" placeholder="e.g. 16/06/2026">
      </div>

      <div class="field" id="fieldTopic">
        <label for="topic">Topic / title</label>
        <input id="topic" type="text" placeholder="e.g. Study & Verification of Ohm's Law">
      </div>

      <div class="row2">
        <div class="field">
          <label for="courseTitle">Course title</label>
          <input id="courseTitle" type="text" placeholder="e.g. Circuit Analysis Lab">
        </div>
        <div class="field">
          <label for="courseCode">Course code</label>
          <input id="courseCode" type="text" placeholder="e.g. CSE 1259">
        </div>
      </div>

      <h2 class="section-title">Submitted to</h2>
      <div class="field">
        <label for="toName">Name</label>
        <input id="toName" type="text" placeholder="e.g. Airin Akter Tania">
      </div>
      <div class="row2">
        <div class="field">
          <label for="toDesig">Designation</label>
          <input id="toDesig" type="text" placeholder="e.g. Lecturer">
        </div>
        <div class="field">
          <label for="toDept">Department</label>
          <input id="toDept" type="text" placeholder="e.g. Computer Science & Engineering">
        </div>
      </div>
      <div class="field">
        <label for="toUni">University</label>
        <input id="toUni" type="text" value="Northern University Bangladesh">
      </div>

      <h2 class="section-title">Submitted by</h2>
      <div class="field">
        <label for="byName">Name</label>
        <input id="byName" type="text" placeholder="e.g. Arman Bin Alauddin">
      </div>
      <div class="row2">
        <div class="field">
          <label for="byId">Student ID</label>
          <input id="byId" type="text" placeholder="e.g. 41240202189">
        </div>
        <div class="field">
          <label for="bySection">Section</label>
          <input id="bySection" type="text" placeholder="e.g. 3B">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="byProgram">Program</label>
          <input id="byProgram" type="text" placeholder="e.g. CSE">
        </div>
        <div class="field">
          <label for="byDept">Department</label>
          <input id="byDept" type="text" placeholder="e.g. CSE">
        </div>
      </div>

      <h2 class="section-title">Submission</h2>
      <div class="field">
        <label for="subDate">Date of submission</label>
        <input id="subDate" type="text" placeholder="e.g. 20/06/2026">
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="downloadPdf">Save as PDF</button>
        <button class="btn btn-secondary" id="downloadPng">Download PNG</button>
        <button class="btn btn-ghost" id="resetForm">Reset</button>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="panel preview-panel hide" id="previewPanel">
      <div class="page-shell">
        <div id="cover">

  const allFields = ['docKind','labNumber','expDate','topic','courseTitle','courseCode',
    'toName','toDesig','toDept','toUni','byName','byId','bySection','byProgram','byDept','subDate'];

  function updateVisibility(){
    const isLab = $('docKind').value === 'LAB REPORT';
    $('fieldLabNumber').classList.toggle('hidden-field', !isLab);
    $('fieldExpDate').classList.toggle('hidden-field', !isLab);
    $('fieldTopic').querySelector('label').textContent = isLab ? 'Experiment title (optional)' : 'Topic / title';
  }

  function render(){
    const v = id => $(id).value.trim();
    const isLab = v('docKind') === 'LAB REPORT';

    if (isLab){
      $('outTitle').textContent = 'Lab Work' + (v('labNumber') ? ' ' + v('labNumber') : '');
      $('outSubtitle').textContent = v('expDate') ? 'Date of experiment: ' + v('expDate') : '';
      $('outTopic').textContent = v('topic');
    } else {
      $('outTitle').textContent = v('docKind') || 'ASSIGNMENT ON';
      $('outSubtitle').textContent = '';
      $('outTopic').textContent = v('topic');
    }

    let courseHtml = '';
    if (v('courseTitle')) courseHtml += 'Course Title: <b>' + escapeHtml(v('courseTitle')) + '</b><br>';
    if (v('courseCode')) courseHtml += 'Course Code: <b>' + escapeHtml(v('courseCode')) + '</b>';
    $('outCourse').innerHTML = courseHtml;

    $('outToName').textContent = v('toName') || '—';
    $('outToDesig').textContent = v('toDesig');
    $('outToDept').textContent = v('toDept');
    $('outToUni').textContent = v('toUni');

    $('outByName').textContent = v('byName') || '—';
    $('outById').textContent = v('byId') ? 'ID: ' + v('byId') : '';
    $('outBySection').textContent = v('bySection') ? 'Section: ' + v('bySection') : '';
    $('outByProgram').textContent = v('byProgram') ? 'Program: ' + v('byProgram') : '';
    $('outByDept').textContent = v('byDept') ? 'Department of ' + v('byDept') : '';

    $('outSubDate').textContent = v('subDate') ? 'Date of Submission: ' + v('subDate') : '';

    updateVisibility();
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  allFields.forEach(id => $(id).addEventListener('input', render));
  $('docKind').addEventListener('change', render);
  render();

  // Logo upload
  const logoInput = $('logoInput');
  const logoImg = $('logoImg');
  const logoDropInner = $('logoDropInner');

  logoInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      logoImg.src = ev.target.result;
      logoDropInner.textContent = file.name + ' — click to change';
    };
    reader.readAsDataURL(file);
  });

  $('clearLogo').addEventListener('click', e => {
    e.preventDefault();
    logoImg.src = DEFAULT_LOGO;
    logoInput.value = '';
    logoDropInner.textContent = 'Using the default NUB logo — click to replace it';
  });

  // Reset
  $('resetForm').addEventListener('click', () => {
    allFields.forEach(id => { if (id !== 'toUni' && id !== 'docKind') $(id).value=''; });
    $('toUni').value = 'Northern University Bangladesh';
    $('docKind').value = 'LAB REPORT';
    $('clearLogo').click();
    render();
  });

  // Mobile tabs
  const tabToggle = $('tabToggle');
  const formPanel = $('formPanel');
  const previewPanel = $('previewPanel');
  tabToggle.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    tabToggle.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if (btn.dataset.tab === 'form'){
      formPanel.classList.remove('hide');
      previewPanel.classList.add('hide');
    } else {
      formPanel.classList.add('hide');
      previewPanel.classList.remove('hide');
    }
  });

  // PNG download: rasterized image, scaled up for crispness
  $('downloadPng').addEventListener('click', async () => {
    const canvas = await html2canvas($('cover'), { scale: 4, useCORS: true, backgroundColor: '#ffffff' });
    const link = document.createElement('a');
    link.download = 'cover-page.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // PDF: use the browser's native print-to-PDF instead of screenshotting the page.
  // This keeps the text as real vector text — sharp at any zoom and selectable/searchable —
  // instead of a blurry, non-selectable raster image.
  $('downloadPdf').addEventListener('click', () => {
    window.print();
  });

})();
</script>
</body>
</html>
